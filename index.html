<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sir Ali Preparations - Student Management System</title>
    <meta name="description" content="Student management system for Sir Ali Preparations: tracking attendance, student progress, syllabus topics, and fee records." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-natural-bg: #F7F8F3;
        --color-natural-surface: #FFFFFF;
        --color-natural-tint: #E9EDE0;
        --color-natural-stone: #F0F2EA;
        --color-natural-border: #E0E4D9;
        --color-natural-primary: #5C6652;
        --color-natural-dark: #2D3329;
        --color-natural-muted: #707969;
        --color-natural-subtle: #8A9382;
      }
      html, body {
        height: auto;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F7F8F3;
        color: #42473E;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Lora', Georgia, serif;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      @media print {
        header, footer, nav, button, .print\:hidden {
          display: none !important;
        }
        body {
          background: white !important;
        }
      }
    </style>
    <meta property="og:title" content="SMARIZSOFT" />
    <meta property="og:description" content="Developed by Team smarizsoft." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
